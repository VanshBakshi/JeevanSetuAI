name: mobile_app
description: >
  JeevanSetuAI - Disaster Response Intelligence Platform.
  Smart India Hackathon level flood prediction, rescue coordination,
  offline emergency response, and AI-powered disaster management app.

publish_to: "none"

version: 1.0.0+1

# =========================================================
# DART SDK
# =========================================================
environment:
  sdk: ">=3.12.0 <4.0.0"

# =========================================================
# DEPENDENCIES
# =========================================================
dependencies:
  flutter:
    sdk: flutter

  # iOS style icons
  cupertino_icons: ^1.0.8

  # Modern fonts
  google_fonts: ^6.3.3

  # Networking
  http: ^1.6.0

  # Local storage / offline cache
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6

  # Connectivity status
  connectivity_plus: ^6.1.5

  # Location services
  geolocator: ^14.0.2

  # Map utilities
  latlong2: ^0.9.1

  # Date & time formatting
  intl: ^0.20.2

  # Smooth animations
  flutter_animate: ^4.5.2

# =========================================================
# DEV DEPENDENCIES
# =========================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# =========================================================
# FLUTTER CONFIGURATION
# =========================================================
flutter:
  uses-material-design: true

  # ---------------- ASSETS ----------------
  assets:
    - assets/images/
    - assets/icons/

  # ---------------- OPTIONAL CUSTOM FONTS ----------------
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
